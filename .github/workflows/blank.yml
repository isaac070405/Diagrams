# Builds the Diagram Workspace from source/ and runs its tests.
# The job is named "build" because the main-protection ruleset requires a check with that name.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: node tests/xyaxis.test.cjs

      - name: Build with Parcel
        run: pnpm exec parcel build index.html --dist-dir dist --no-source-maps

      - name: Inline into one HTML file
        run: pnpm exec html-inline dist/index.html > bundle.html

      - name: Check the bundle
        run: |
          test -s bundle.html
          echo "bundle.html: $(wc -c < bundle.html) bytes"
